                } else if (attempts < maxAttempts) {

            checkClerk();
        };
        
        // Client-side validation for missing configuration
        (function validateConfiguration() {
            console.log('🔍 [CONFIG] Validating WASM configuration...');
            
            const requiredKeys = [
                'CLERK_PUBLISHABLE_KEY', 'CLERK_SIGN_IN_URL', 'CLERK_SIGN_UP_URL',
                'FIREBASE_API_KEY', 'FIREBASE_PROJECT_ID', 'FIREBASE_WEB_APP_ID',

                'APOLLO_GRAPHQL_ENDPOINT', 'APOLLO_WEBSOCKET_ENDPOINT',
                'MYCLOSET_API_BASE_URL'
            ];
            
            const missingKeys = [];
            const templateKeys = [];
            
            requiredKeys.forEach(key => {
                const value = window.APP_CONFIG[key];
                if (!value) {
                    missingKeys.push(key);
                } else if (value.startsWith('${') && value.endsWith('}')) {
                    templateKeys.push(key);
                }
            });
            
            if (missingKeys.length > 0 || templateKeys.length > 0) {
                const errorMessages = [];
                
                if (missingKeys.length > 0) {
                    errorMessages.push(`Missing configuration keys: ${missingKeys.join(', ')}`);
                }
                
                if (templateKeys.length > 0) {
                    errorMessages.push(`Unresolved template variables: ${templateKeys.join(', ')}`);
                }
                
                const errorMessage = `
                    <div style="
                        font-family: monospace;
                        background: #f8f8f8;
                        border: 2px solid #e74c3c;
                        border-radius: 8px;
                        padding: 20px;
                        margin: 20px;
                        max-width: 800px;
                        margin: 20px auto;

                        <p><strong>The application cannot start due to missing configuration:</strong></p>
                        <ul style="color: #c0392b;">
                            ${errorMessages.map(msg => `<li>${msg}</li>`).join('')}

                        <h3>How to fix this:</h3>
                        <ol>

                        </ol>
                        <p><strong>Required configuration keys:</strong></p>
                        <ul style="font-size: 12px; color: #666;">
                            ${requiredKeys.map(key => `<li>${key}</li>`).join('')}
                        </ul>
                        <p style="margin-bottom: 0;">

                            • .env.example<br>
                            • Applications/Demo3/ENVIRONMENT_CONFIGURATION_REPORT.md
                        </p>
                    </div>
                `;
                
                console.error('❌ [CONFIG] Configuration validation failed:', errorMessages);
                document.body.innerHTML = errorMessage;
                
                throw new Error(`Configuration Error: ${errorMessages.join('; ')}`);
            }
            
            console.log('✅ [CONFIG] Configuration validation passed');
            
            // Only initialize Clerk after configuration validation passes
            initializeClerkScript();
        })();
        
        // Dynamically create Clerk script with configuration from APP_CONFIG
        function initializeClerkScript() {
            console.log('🔍 [CLERK] Initializing Clerk script...');
            
            if (!window.APP_CONFIG || !window.APP_CONFIG.CLERK_PUBLISHABLE_KEY) {
                console.error('❌ [CLERK] Cannot initialize Clerk: APP_CONFIG not available or invalid');
                return;
            }
            
            // Check if publishable key is still a template variable
            if (window.APP_CONFIG.CLERK_PUBLISHABLE_KEY.startsWith('${') && 
                window.APP_CONFIG.CLERK_PUBLISHABLE_KEY.endsWith('}')) {
                console.error('❌ [CLERK] Cannot initialize Clerk: publishable key is unresolved template variable');
                return;
            }
            
            const script = document.createElement('script');
            script.id = 'clerkScript';
            script.async = true;
            script.crossOrigin = 'anonymous';
            script.setAttribute('data-clerk-publishable-key', window.APP_CONFIG.CLERK_PUBLISHABLE_KEY);
            
            // Extract domain from sign-in URL for Clerk script source
            const domain = window.APP_CONFIG.CLERK_DOMAIN || 
                          window.APP_CONFIG.CLERK_SIGN_IN_URL.replace('https://', '').replace('http://', '').split('/')[0];
            
            script.src = `https://${domain}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
            script.onload = window.handleClerkScriptLoad;
            script.onerror = window.handleClerkScriptError;
            script.defer = true;
            
            document.head.appendChild(script);
            
            console.log('✅ [CLERK] Clerk script initialized with domain:', domain);
        }
    </script>

    <!-- Load WASM app AFTER configuration is set up -->
    <script>
        // Load the Go Tailscale WASM module and expose its JS API on globalThis.
        // window.__tailscaleReady resolves once tailscaleStart/Stop/Status are registered.
        window.__tailscaleReady = (async () => {
            if (typeof WebAssembly === 'undefined') return;
            // Pre-install a `process` polyfill BEFORE loading wasm_exec.js. Go's wasm_exec.js
            // skips installing its own when `globalThis.process` already exists. Kotlin/WASM's
            // env detector evaluates `process.release.name === 'node'` (uninstantiated.mjs:5181);
            // Go's polyfill omits `release`, which throws "Cannot read properties of undefined
            // (reading 'name')" during Compose instantiation. We provide `release.name='browser'`
            // so Kotlin falls through to the browser branch, plus the methods Go's syscalls call.
            if (!globalThis.process) {
                const enosys = () => { const e = new Error('not implemented'); e.code = 'ENOSYS'; return e; };
                globalThis.process = {
                    release: { name: 'browser' },
                    getuid: () => -1, getgid: () => -1, geteuid: () => -1, getegid: () => -1,
                    getgroups: () => { throw enosys(); },
                    pid: -1, ppid: -1,
                    umask: () => { throw enosys(); },
                    cwd: () => { throw enosys(); },
                    chdir: () => { throw enosys(); },
                };
            }
            await new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'wasm_exec.js';
                s.onload = resolve;
                s.onerror = () => reject(new Error('Failed to load wasm_exec.js'));
                document.head.appendChild(s);
            });
            if (typeof Go === 'undefined') return;
            const go = new Go();
            const result = await WebAssembly.instantiateStreaming(fetch('tailscale.wasm'), go.importObject);
            // go.run() blocks until the Go runtime exits (it never does — main() parks on a channel).
            // We intentionally do NOT await it; instead we return a Promise that resolves once Go's
            // main() has registered the JS functions, which happens synchronously before it parks.
            // We detect readiness by polling until tailscaleStart is visible on globalThis.
            go.run(result.instance);
            await new Promise((resolve, reject) => {
                let attempts = 0;
                const maxAttempts = 100; // 5 seconds total
                const check = setInterval(() => {
                    if (typeof tailscaleStart === 'function') {
                        clearInterval(check);
                        resolve();
                    } else if (++attempts >= maxAttempts) {
                        clearInterval(check);
                        reject(new Error('tailscaleStart was not registered after WASM load'));
                    }
                }, 50);
            });
        })();
    </script>

<div id="app-container">

<script>
    console.log('🔍 [WASM AUTH] Initializing WASM Clerk integration');

    let clerk = null;
    let clerkInitializationAttempted = false;
    let domReady = false;
    let showingAuth = false;

    // Initialize the WASM app bridge
    window.WasmApp = {
        onClerkSignInSuccess: function (token) {
            console.log('✅ [WASM AUTH] Sign in successful, token received');
            hideClerkAuth();

            // Store token in localStorage for WASM to pick up
            console.log('💾 [WASM AUTH] Storing token in localStorage');
            localStorage.setItem('clerk_auth_token', token);
            localStorage.setItem('clerk_auth_timestamp', Date.now().toString());

            // Dispatch event to notify WASM
            const event = new CustomEvent('clerkAuthSuccess', {
                detail: { token: token, timestamp: Date.now() }
            });
            window.dispatchEvent(event);
        },

        onClerkSignInError: function (error) {
            console.error('❌ [WASM AUTH] Sign in error:', error);
            // Could show error UI or retry
        },

        onClerkSignOutSuccess: function () {
            console.log('✅ [WASM AUTH] Sign out successful');
            // Clear stored token
            localStorage.removeItem('clerk_auth_token');
            localStorage.removeItem('clerk_auth_timestamp');
            showClerkAuth();
        }
    };

    function showClerkAuth() {
        console.log('🔍 [WASM AUTH] Showing Clerk auth overlay');
        const overlay = document.getElementById('clerk-auth-overlay');
        if (overlay) {
            console.log('✅ [WASM AUTH] Found auth overlay, making it visible');
            overlay.style.display = 'flex';
            showingAuth = true;
            loadSigninContainer();
        } else {
            console.error('❌ [WASM AUTH] Could not find clerk-auth-overlay element');
        }
    }

    function hideClerkAuth() {
        console.log('🔍 [WASM AUTH] Hiding Clerk auth overlay');
        const overlay = document.getElementById('clerk-auth-overlay');
        if (overlay) {
            overlay.style.display = 'none';
            showingAuth = false;
        }
    }

    function handleClerkScriptError() {
        console.error('❌ [WASM AUTH] Failed to load Clerk.js script');
        // Don't auto-show on script error - let the Kotlin app handle it
        console.log('🔍 [WASM AUTH] Script load failed, waiting for manual trigger');
    }

    function handleClerkScriptLoad() {
        console.log('✅ [WASM AUTH] Clerk.js script loaded');
        // Wait for Clerk to be available on window
        waitForClerk();
    }

    function waitForClerk() {
        console.log('🔍 [WASM AUTH] Waiting for Clerk to be available...');
        let attempts = 0;
        const maxAttempts = 20; // 10 seconds max

        const checkClerk = () => {
            attempts++;
            console.log(`🔍 [WASM AUTH] Checking for Clerk (attempt ${attempts}/${maxAttempts})`);

            if (window.Clerk) {
                console.log('✅ [WASM AUTH] Clerk is now available on window');
                if (domReady) {
                    initializeClerk();
                }
            } else if (attempts < maxAttempts) {
                setTimeout(checkClerk, 500);
            } else {
                console.error('❌ [WASM AUTH] Clerk not available after maximum attempts');
                // Don't auto-show - let the Kotlin app handle it
                console.log('🔍 [WASM AUTH] Clerk unavailable, waiting for manual trigger');
            }
        };

        checkClerk();
    }

    async function initializeClerk() {
        if (clerkInitializationAttempted) {
            console.log('🔍 [WASM AUTH] Clerk initialization already attempted');
            return;
        }
        clerkInitializationAttempted = true;

        console.log('🔍 [WASM AUTH] Initializing Clerk...');

        try {
            if (window.Clerk) {
                clerk = window.Clerk;
                await clerk.load();
                console.log('✅ [WASM AUTH] Clerk loaded successfully');
                console.log('🔍 [WASM AUTH] Clerk user:', clerk.user);
                console.log('🔍 [WASM AUTH] Clerk session:', clerk.session);

                // Set up Clerk listener for auth state changes
                clerk.addListener(async ({ user, session }) => {
                    console.log('[WASM AUTH] Clerk state changed. User:', !!user, 'Session:', !!session);
                    if (session && user) {
                        try {
                            const jwtToken = await session.getToken();
                            if (jwtToken) {
                                console.log('✅ [WASM AUTH] JWT token obtained via listener');
                                window.WasmApp.onClerkSignInSuccess(jwtToken);
                            }
                        } catch (error) {
                            console.error('❌ [WASM AUTH] Error getting JWT token:', error);
                        }
                    } else {
                        console.log('🔍 [WASM AUTH] User signed out or no session');
                    }
                });

                // Check if user is already authenticated
                if (clerk.user && clerk.session) {
                    console.log('✅ [WASM AUTH] User already authenticated');
                    try {
                        const token = await clerk.session.getToken();
                        window.WasmApp.onClerkSignInSuccess(token);
                    } catch (error) {
                        console.error('❌ [WASM AUTH] Error getting existing token:', error);
                    }
                } else {
                    console.log('🔍 [WASM AUTH] No existing authentication found');
                    // Don't auto-show auth dialog - let the Kotlin app handle it via WasmAuthBridge
                    console.log('🔍 [WASM AUTH] Waiting for Kotlin app to request authentication');
                }

            } else {
                throw new Error('Clerk not available on window');
            }
        } catch (error) {
            console.error('❌ [WASM AUTH] Error initializing Clerk:', error);
            // Don't auto-show on error - let the Kotlin app handle it
            console.log('🔍 [WASM AUTH] Clerk initialization failed, waiting for manual trigger');
        }
    }

    function loadSigninContainer() {
        console.log('🔍 [WASM AUTH] Loading sign-in container - clerk:', !!clerk, 'showingAuth:', showingAuth);

        if (!showingAuth) {
            console.log('⚠️ [WASM AUTH] Not showing auth, skipping container load');
            return;
        }

        const clerkAuthContainer = document.getElementById('clerk-auth-container');
        if (!clerkAuthContainer) {
            console.error('❌ [WASM AUTH] Clerk auth container not found');
            return;
        }

        if (!clerk) {
            console.log('⚠️ [WASM AUTH] Clerk not ready, showing fallback message');
            clerkAuthContainer.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <p>Loading authentication...</p>
                    <p style="font-size: 12px; color: #666; margin-top: 10px;">
                        If this persists, try refreshing the page or check your network connection.
                    </p>
                    <button onclick="window.location.reload()" style="
                        margin-top: 10px;
                        padding: 8px 16px;
                        background: #D6943D;
                        color: white;
                        border: none;
                        border-radius: 4px;
                        cursor: pointer;
                    ">Refresh Page</button>
                </div>
            `;
            // Retry after a short delay
            setTimeout(() => {
                if (clerk) {
                    loadSigninContainer();
                }
            }, 500);
            return;
        }

        // Check if user is already signed in
        if (clerk.user) {
            console.log('✅ [WASM AUTH] User already signed in');
            hideClerkAuth();
            return;
        }

        try {
            console.log('🔍 [WASM AUTH] Mounting Clerk sign-in component');
            // Clear any existing content
            clerkAuthContainer.innerHTML = '';

            // Mount sign-in with minimal configuration to avoid redirect issues
            clerk.mountSignIn(clerkAuthContainer, {
                appearance: {
                    elements: {
                        card: { margin: "0 auto" },
                        formButtonPrimary: {
                            backgroundColor: "#D6943D",
                            "&:hover": { backgroundColor: "#c2853a" },
                        },
                    },
                },
            });
            console.log('✅ [WASM AUTH] Sign-in component mounted successfully');
        } catch (error) {
            console.error('❌ [WASM AUTH] Error mounting sign-in:', error);
            clerkAuthContainer.innerHTML = `<div style="text-align: center; padding: 20px; color: red;">Error loading authentication: ${error.message}</div>`;
            if (window.WasmApp && window.WasmApp.onClerkSignInError) {
                window.WasmApp.onClerkSignInError(error.message);
            }
        }
    }

    function loadSignupContainer() {
        if (!clerk || !showingAuth) return;

        console.log('🔍 [WASM AUTH] Loading sign-up container');
        const clerkAuthContainer = document.getElementById('clerk-auth-container');

        if (!clerkAuthContainer) {
            console.error('❌ [WASM AUTH] Clerk auth container not found');
            return;
        }

        try {
            // Clear any existing content
            clerkAuthContainer.innerHTML = '';

            clerk.mountSignUp(clerkAuthContainer, {
                appearance: {
                    elements: {
                        card: { margin: "0 auto" },
                        formButtonPrimary: {
                            backgroundColor: "#D6943D",
                            "&:hover": { backgroundColor: "#c2853a" },
                        },
                    },
                },
            });
            console.log('✅ [WASM AUTH] Sign-up component mounted');
        } catch (error) {
            console.error('❌ [WASM AUTH] Error mounting sign-up:', error);
            window.WasmApp.onClerkSignInError(error.message);
        }
    }

    // Listen for custom events from WASM
    window.addEventListener('showClerkAuth', function (event) {
        console.log('🔍 [WASM AUTH] Received showClerkAuth event');
        showClerkAuth();
    });

    window.addEventListener('showClerkSignup', function (event) {
        console.log('🔍 [WASM AUTH] Received showClerkSignup event');
        const overlay = document.getElementById('clerk-auth-overlay');
        if (overlay) {
            overlay.style.display = 'flex';
            showingAuth = true;
            loadSignupContainer();
        }
    });

    window.addEventListener('hideClerkAuth', function (event) {
        console.log('🔍 [WASM AUTH] Received hideClerkAuth event');
        hideClerkAuth();
    });

    document.addEventListener('DOMContentLoaded', function () {
        console.log('🔍 [WASM AUTH] DOM ready');
        domReady = true;

        // If Clerk is already available, initialize it
        if (window.Clerk && !clerkInitializationAttempted) {
            console.log('🔍 [WASM AUTH] Clerk already available, initializing...');
            initializeClerk();
        } else if (!window.Clerk) {
            console.log('🔍 [WASM AUTH] Clerk not yet available, waiting for script load...');
            // Start waiting for Clerk if script hasn't loaded yet
            waitForClerk();
        }

        // Auth is triggered exclusively by the Kotlin app via WasmAuthBridge events.
    });

    window.addEventListener('error', function (event) {
        console.error('❌ [WASM AUTH] Global error:', event.error);
    });

    window.addEventListener('unhandledrejection', function (event) {
        console.error('❌ [WASM AUTH] Unhandled rejection:', event.reason);
    });

    // Debug function - you can call this from browser console
    window.debugClerkState = function () {
        console.log('🔍 [DEBUG] Clerk object:', clerk);
        console.log('🔍 [DEBUG] Clerk user:', clerk?.user);
        console.log('🔍 [DEBUG] Clerk session:', clerk?.session);
        console.log('🔍 [DEBUG] Showing auth:', showingAuth);
        console.log('🔍 [DEBUG] DOM ready:', domReady);
        console.log('🔍 [DEBUG] Initialization attempted:', clerkInitializationAttempted);
    };

    // Debug function to test user data retrieval
    window.debugClerkUserData = function () {
        if (clerk && clerk.user) {
            console.log('👤 [DEBUG] User ID:', clerk.user.id);
            console.log('👤 [DEBUG] Username:', clerk.user.username);
            console.log('👤 [DEBUG] First Name:', clerk.user.firstName);
            console.log('👤 [DEBUG] Last Name:', clerk.user.lastName);
            console.log('👤 [DEBUG] Email Addresses:', clerk.user.emailAddresses);
            console.log('👤 [DEBUG] Primary Email:', clerk.user.primaryEmailAddress?.emailAddress);
            console.log('👤 [DEBUG] Full User Object:', clerk.user);
        } else {
            console.log('❌ [DEBUG] No user data available');
        }
    };

    // Test the WASM user data integration
    window.testWasmUserData = function () {
        console.log('🧪 [DEBUG] Testing WASM user data integration...');

        // Test individual functions
        window.checkClerkAuthentication((isAuth) => {
            console.log('🔍 [DEBUG] Authentication check:', isAuth);

            if (isAuth) {
                window.getClerkUserIdFromJS((userId) => {
                    console.log('👤 [DEBUG] User ID from WASM:', userId);
                });

                window.getClerkUsernameFromJS((username) => {
                    console.log('👤 [DEBUG] Username from WASM:', username);
                });

                window.getClerkUserEmailFromJS((email) => {
                    console.log('👤 [DEBUG] Email from WASM:', email);
                });

                window.getClerkUserFirstNameFromJS((firstName) => {
                    console.log('👤 [DEBUG] First name from WASM:', firstName);
                });

                window.getClerkUserLastNameFromJS((lastName) => {
                    console.log('👤 [DEBUG] Last name from WASM:', lastName);
                });
            }
        });
    };

    // Test the token integration
    window.testClerkToken = function () {
        console.log('🔑 [DEBUG] Testing Clerk token integration...');

        window.getClerkToken((token) => {
            if (token) {
                console.log('✅ [DEBUG] Token retrieved from Clerk:', token.substring(0, 20) + '...');
            } else {
                console.log('❌ [DEBUG] No token available from Clerk');
            }
        });
    };

    // Test both auth flows
    window.testAuthFlows = function () {
        console.log('🧪 [DEBUG] Testing auth flows...');

        console.log('📝 [DEBUG] Testing sign-up flow...');
        window.dispatchEvent(new CustomEvent('showClerkSignup'));

        setTimeout(() => {
            hideClerkAuth();
            console.log('🔑 [DEBUG] Testing sign-in flow...');
            window.dispatchEvent(new CustomEvent('showClerkAuth'));
        }, 3000);
    };

    // Force show auth for debugging
    window.forceShowAuth = function () {
        console.log('🔍 [DEBUG] Force showing auth');
        showClerkAuth();
    };

    // Debug function to check current state
    window.debugAuthState = function () {
        console.log('🔍 [DEBUG] Current auth state:');
        console.log('  - Clerk available:', !!window.Clerk);
        console.log('  - Clerk instance:', !!clerk);
        console.log('  - Clerk user:', clerk?.user);
        console.log('  - Clerk session:', clerk?.session);
        console.log('  - Showing auth:', showingAuth);
        console.log('  - DOM ready:', domReady);
        console.log('  - Initialization attempted:', clerkInitializationAttempted);
        console.log('  - Auth overlay element:', !!document.getElementById('clerk-auth-overlay'));
        console.log('  - Auth container element:', !!document.getElementById('clerk-auth-container'));
    };

    // Clerk user data functions for WASM integration
    window.checkClerkAuthentication = function (callback) {
        try {
            if (clerk && clerk.user && clerk.session) {
                callback(true);
            } else {
                callback(false);
            }
        } catch (error) {
            console.error('❌ [CLERK WASM] Error checking authentication:', error);
            callback(false);
        }
    };

    window.getClerkUserIdFromJS = function (callback) {
        try {
            if (clerk && clerk.user) {
                callback(clerk.user.id || null);
            } else {
                callback(null);
            }
        } catch (error) {
            console.error('❌ [CLERK WASM] Error getting user ID:', error);
            callback(null);
        }
    };

    window.getClerkUsernameFromJS = function (callback) {
        try {
            if (clerk && clerk.user) {
                // Try different username fields
                const username = clerk.user.username ||
                    clerk.user.firstName ||
                    clerk.user.emailAddresses?.[0]?.emailAddress?.split('@')[0] ||
                    'User';
                callback(username);
            } else {
                callback(null);
            }
        } catch (error) {
            console.error('❌ [CLERK WASM] Error getting username:', error);
            callback(null);
        }
    };

    window.getClerkUserEmailFromJS = function (callback) {
        try {
            if (clerk && clerk.user) {
                const email = clerk.user.primaryEmailAddress?.emailAddress ||
                    clerk.user.emailAddresses?.[0]?.emailAddress ||
                    null;
                callback(email);
            } else {
                callback(null);
            }
        } catch (error) {
            console.error('❌ [CLERK WASM] Error getting email:', error);
            callback(null);
        }
    };

    window.getClerkUserFirstNameFromJS = function (callback) {
        try {
            if (clerk && clerk.user) {
                callback(clerk.user.firstName || null);
            } else {
                callback(null);
            }
        } catch (error) {
            console.error('❌ [CLERK WASM] Error getting first name:', error);
            callback(null);
        }
    };

    window.getClerkUserLastNameFromJS = function (callback) {
        try {
            if (clerk && clerk.user) {
                callback(clerk.user.lastName || null);
            } else {
                callback(null);
            }
        } catch (error) {
            console.error('❌ [CLERK WASM] Error getting last name:', error);
            callback(null);
        }
    };

    window.signOutFromClerk = function (callback) {
        try {
            if (clerk) {
                clerk.signOut().then(() => {
                    console.log('✅ [CLERK WASM] Sign out successful');
                    callback(true);
                }).catch((error) => {
                    console.error('❌ [CLERK WASM] Sign out error:', error);
                    callback(false);
                });
            } else {
                console.error('❌ [CLERK WASM] Clerk not available for sign out');
                callback(false);
            }
        } catch (error) {
            console.error('❌ [CLERK WASM] Error during sign out:', error);
            callback(false);
        }
    };

    // Additional functions for TokenLocalDataSource integration
    window.getClerkToken = function (callback) {
        try {
            if (clerk && clerk.session) {
                clerk.session.getToken().then((token) => {
                    console.log('🔑 [CLERK WASM] Retrieved token from Clerk session');
                    callback(token);
                }).catch((error) => {
                    console.error('❌ [CLERK WASM] Error getting token from session:', error);
                    callback(null);
                });
            } else if (clerk && clerk.user) {
                // Fallback: try to get token directly from user
                console.log('⚠️ [CLERK WASM] No session, trying to get token from user');
                callback(null); // Let it fall back to localStorage
            } else {
                console.log('ℹ️ [CLERK WASM] No Clerk session or user available');
                callback(null);
            }
        } catch (error) {
            console.error('❌ [CLERK WASM] Error getting Clerk token:', error);
            callback(null);
        }
    };

    window.signOutFromClerkJS = function (callback) {
        // Alias for consistency with TokenLocalDataSource
        window.signOutFromClerk(callback);
    };

    window.getClerkUnsafeMetadataFromJS = function (callback) {
        try {
            if (clerk && clerk.user) {
                const metadata = clerk.user.unsafeMetadata;
                if (metadata && typeof metadata === 'object') {
                    callback(JSON.stringify(metadata));
                } else {
                    callback(null);
                }
            } else {
                callback(null);
            }
        } catch (error) {
            console.error('❌ [CLERK WASM] Error getting unsafeMetadata:', error);
            callback(null);
        }
    };
</script>
