<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revivle Sign in</title>
    <script id="clerkScript" async crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_YmVsb3ZlZC1qYXdmaXNoLTIzLmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://smooth-cod-50.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        onload="handleClerkScriptLoad()" onerror="handleClerkScriptError()" defer>
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
        }
        .loading {
            background: #e3f2fd;
            color: #1976d2;
        }
        .success {
            background: #e8f5e8;
            color: #2e7d32;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Revivle</div>
        <div id="status" class="status loading">
            <div class="spinner"></div>
            Initializing authentication...
        </div>
        <div id="clerk-signin"></div>
    </div>

    <script>
        console.log('🔍 [AUTH DEBUG] ClerkSignIn.html inline script block executing');
        
        let clerk = null;
        let clerkInitializationAttempted = false;
        let domReady = false;

        function updateStatus(message, type = 'loading') {
            const statusElement = document.getElementById('status');
            statusElement.textContent = message;
            statusElement.className = `status ${type}`;
            if (type === 'loading') {
                statusElement.innerHTML = `<div class="spinner"></div>${message}`;
            }
        }

        function completeSignIn(message) {
            console.log(`🔍 [AUTH DEBUG] Completing sign in: ${message}`);
            
            let isCallbackSuccessful = false;

            // 1. Android Callback
            if (typeof window.Android !== 'undefined' && typeof window.Android.onClerkSignInSuccess === 'function') {
                window.Android.onClerkSignInSuccess();
                isCallbackSuccessful = true;
                console.log("Android callback successful!");
            }
            // 2. iOS Callback
            else if (typeof window.webkit !== 'undefined' && typeof window.webkit.messageHandlers.clerkSignInHandler !== 'undefined') {
                window.webkit.messageHandlers.clerkSignInHandler.postMessage();
                isCallbackSuccessful = true;
                console.log("iOS callback successful!");
            }
            // 3. Desktop Callback
            else if (typeof window.DesktopBridge !== 'undefined' && typeof window.DesktopBridge.onClerkSignInSuccess === 'function') {
                window.DesktopBridge.onClerkSignInSuccess();
                isCallbackSuccessful = true;
                console.log("Desktop callback successful!");
            }
            // 4. WASM Callback
            else if (typeof window.WasmApp !== 'undefined' && typeof window.WasmApp.onClerkSignInSuccess === 'function') {
                window.WasmApp.onClerkSignInSuccess();
                isCallbackSuccessful = true;
                console.log("WASM callback successful!");
            }

            if (!isCallbackSuccessful) {
                console.warn('⚠️ [AUTH DEBUG] No platform callback found. Available objects:', {
                    Android: typeof window.Android,
                    webkit: typeof window.webkit,
                    DesktopBridge: typeof window.DesktopBridge,
                    WasmApp: typeof window.WasmApp
                });
            }
        }

        function handleClerkScriptError() {
            console.error('❌ [AUTH DEBUG] Failed to load Clerk.js script (onerror event).');
            updateStatus('Error: Authentication library could not be loaded.', 'error');
        }

        function handleClerkScriptLoad() {
            console.log('✅ [AUTH DEBUG] Clerk.js script loaded (onload event fired).');
            if (domReady) {
                initializeClerk();
            }
        }

        async function initializeClerk() {
            if (clerkInitializationAttempted) {
                console.log('🔍 [AUTH DEBUG] Initialization already attempted or in progress.');
                return;
            }
            clerkInitializationAttempted = true;

            console.log('🔍 [AUTH DEBUG] Attempting to initialize Clerk...');
            updateStatus('Loading authentication interface...');

            try {
                if (window.Clerk) {
                    clerk = window.Clerk;
                    console.log('🔍 [AUTH DEBUG] window.Clerk found. Calling clerk.load()...');
                    await clerk.load();
                    console.log('✅ [AUTH DEBUG] Clerk.load() completed.');

                    if (clerk.user) {
                        console.log('✅ [AUTH DEBUG] User already signed in.');
                        updateStatus('Already signed in. Redirecting...', 'success');
                        completeSignIn('User already authenticated');
                    } else {
                        console.log('🔍 [AUTH DEBUG] No user signed in. Mounting sign-in component...');
                        updateStatus('Please sign in to continue');
                        
                        const signInDiv = document.getElementById('clerk-signin');
                        clerk.mountSignIn(signInDiv);
                        
                        // Listen for sign-in success
                        clerk.addListener('user', (user) => {
                            if (user) {
                                console.log('✅ [AUTH DEBUG] User signed in successfully.');
                                updateStatus('Sign in successful!', 'success');
                                completeSignIn('Sign in completed');
                            }
                        });
                    }
                } else {
                    throw new Error('Clerk JS not available on window even after script onload.');
                }
            } catch (error) {
                console.error('❌ [AUTH DEBUG] Error during Clerk initialization:', error);
                updateStatus(`Authentication error: ${error.message}`, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔍 [AUTH DEBUG] DOM content loaded.');
            domReady = true;
            
            if (window.Clerk) {
                initializeClerk();
            }
        });
    </script>
</body>
</html>
